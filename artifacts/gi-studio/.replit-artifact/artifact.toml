kind = "web"
previewPath = "/studio/"
title = "Generational Intelligence Studio"
description = "Development-only private content studio for managing Generational Intelligence projects, approved public assets, internal files and notes, editorial status, ordering, publication, previews, and snapshot rollback."
version = "1.0.0"
id = "artifacts/gi-studio"
router = "path"

[[services]]
name = "web"
paths = [ "/studio/" ]
localPort = 24203

# Intentionally development-only. Do not add services.production here:
# the public deployment must never serve the Studio artifact.
[services.development]
run = "pnpm --filter @workspace/gi-studio run dev"

[services.env]
PORT = "24203"
BASE_PATH = "/studio/"